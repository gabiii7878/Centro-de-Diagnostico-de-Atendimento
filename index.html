<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDA — Centro de Diagnóstico e Atendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#10288C;
  --blue-deep:#0B1D68;
  --white:#FFFFFF;
  --blue-light:#9CAFFF;
  --teal:#18A6A6;
  --teal-deep:#0F7A7A;
  --ink:#12172E;
  --ink-soft:#4B5170;
  --bg-soft:#F4F6FF;
  --line:#E4E8FB;
  --danger:#D64545;
  --warn:#D69A1F;
  --ok:#1FA361;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:10px;
  --shadow-sm:0 1px 2px rgba(16,40,140,0.06), 0 1px 1px rgba(16,40,140,0.04);
  --shadow-md:0 8px 24px rgba(16,40,140,0.08);
  --shadow-lg:0 20px 48px rgba(16,40,140,0.14);
  --font-display:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;color:var(--blue);letter-spacing:-0.01em;}
p{margin:0;line-height:1.6;color:var(--ink-soft);}
a{color:inherit;text-decoration:none;}
button{font-family:var(--font-body);cursor:pointer;border:none;background:none;}
ul{margin:0;padding:0;list-style:none;}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
.container{max-width:1240px;margin:0 auto;padding:0 24px;}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:var(--teal-deep);font-weight:600;}
.section{padding:88px 0;}
.section-tight{padding:56px 0;}
.section-title{font-size:clamp(26px,3.4vw,38px);font-weight:800;margin-top:10px;}
.section-sub{max-width:620px;margin-top:14px;font-size:16px;}
.section-head{margin-bottom:44px;}
.section-head.center{text-align:center;margin-left:auto;margin-right:auto;}
.section-head.center .section-sub{margin-left:auto;margin-right:auto;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;font-weight:700;font-size:15px;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;white-space:nowrap;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--teal);color:var(--white);box-shadow:0 10px 24px rgba(24,166,166,0.32);}
.btn-primary:hover{background:var(--teal-deep);box-shadow:0 14px 30px rgba(24,166,166,0.4);transform:translateY(-1px);}
.btn-secondary{background:var(--white);color:var(--blue);border:1.5px solid var(--line);}
.btn-secondary:hover{border-color:var(--blue-light);background:var(--bg-soft);}
.btn-ghost-light{background:rgba(255,255,255,0.12);color:var(--white);border:1.5px solid rgba(255,255,255,0.35);}
.btn-ghost-light:hover{background:rgba(255,255,255,0.2);}
.btn-sm{padding:9px 16px;font-size:13px;border-radius:999px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}

/* Header */
.site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1240px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;color:var(--blue);font-size:20px;}
.logo-mark{width:40px;height:40px;flex-shrink:0;}
.logo-sub{font-size:10.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.02em;margin-top:1px;}
.nav-links{display:flex;align-items:center;gap:6px;}
.nav-links a{padding:10px 14px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--ink-soft);transition:background .15s, color .15s;}
.nav-links a:hover, .nav-links a.active{background:var(--bg-soft);color:var(--blue);}
.header-actions{display:flex;align-items:center;gap:10px;}
.menu-toggle{display:none;width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center;background:var(--bg-soft);}
.mobile-nav{display:none;flex-direction:column;gap:2px;padding:10px 16px 18px;border-top:1px solid var(--line);}
.mobile-nav a{padding:12px 8px;border-radius:10px;font-weight:600;color:var(--ink);}
.mobile-nav a:hover{background:var(--bg-soft);}

/* Hero */
.hero{position:relative;background:linear-gradient(160deg,var(--blue-deep) 0%,var(--blue) 55%, #16349E 100%);overflow:hidden;padding:76px 0 96px;}
.hero-scan{position:absolute;inset:0;opacity:0.5;pointer-events:none;}
.hero-scan svg{width:100%;height:100%;}
.hero-grid{position:relative;display:grid;grid-template-columns:1.1fr 0.9fr;gap:56px;align-items:center;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(156,175,255,0.16);border:1px solid rgba(156,175,255,0.4);color:var(--blue-light);padding:8px 14px;border-radius:999px;font-family:var(--font-mono);font-size:12px;letter-spacing:0.08em;margin-bottom:22px;}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(24,166,166,0.25);animation:pulseDot 2s infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:0.4;}}
.hero h1{color:var(--white);font-size:clamp(34px,4.6vw,54px);font-weight:800;line-height:1.06;letter-spacing:-0.02em;}
.hero h1 span{color:var(--blue-light);}
.hero p.lead{color:rgba(255,255,255,0.82);font-size:18px;margin-top:20px;max-width:520px;}
.hero-ctas{display:flex;gap:14px;margin-top:32px;flex-wrap:wrap;}
.hero-quickinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:44px;}
.quick-item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.16);border-radius:14px;padding:14px;}
.quick-item .qi-label{color:rgba(255,255,255,0.6);font-size:11px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em;}
.quick-item .qi-value{color:var(--white);font-weight:700;font-size:14px;margin-top:4px;}
.hero-card{background:var(--white);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow-lg);}
.hero-card-head{display:flex;align-items:center;justify-content:space-between;}
.hero-card-head h3{font-size:16px;}
.live-pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--teal-deep);background:rgba(24,166,166,0.12);padding:5px 10px;border-radius:999px;font-weight:700;}
.live-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);animation:pulseDot 1.8s infinite;}
.status-big{display:flex;align-items:center;gap:14px;margin-top:20px;padding:18px;border-radius:14px;background:var(--bg-soft);}
.status-badge{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.status-badge.normal{background:rgba(31,163,97,0.14);}
.status-badge.moderado{background:rgba(214,154,31,0.14);}
.status-badge.alto{background:rgba(214,69,69,0.14);}
.status-text .st-label{font-weight:700;font-size:15px;}
.status-text .st-sub{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.wait-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);}
.wait-row .wt-label{font-size:13px;color:var(--ink-soft);}
.wait-row .wt-value{font-family:var(--font-mono);font-weight:700;font-size:22px;color:var(--blue);}
.hero-card-footnote{margin-top:14px;font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}

/* Cards grid */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.help-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:28px 24px;box-shadow:var(--shadow-sm);transition:transform .2s, box-shadow .2s, border-color .2s;display:flex;flex-direction:column;height:100%;}
.help-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:var(--blue-light);}
.help-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--blue) 0%, #2544B8 100%);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:18px;}
.help-card h3{font-size:18px;margin-bottom:8px;}
.help-card p{font-size:14.5px;flex-grow:1;}
.help-card .btn{margin-top:18px;}

/* Status/movement section */
.status-panel{background:var(--bg-soft);border-radius:var(--radius-lg);padding:36px;border:1px solid var(--line);}
.status-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:24px;}
.mini-status{background:var(--white);border-radius:var(--radius-md);padding:20px;border:1px solid var(--line);}
.mini-status .ms-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;}
.pill.normal{background:rgba(31,163,97,0.12);color:var(--ok);}
.pill.moderado{background:rgba(214,154,31,0.12);color:var(--warn);}
.pill.alto{background:rgba(214,69,69,0.12);color:var(--danger);}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
.updated-tag{font-family:var(--font-mono);font-size:11px;color:var(--teal-deep);display:flex;align-items:center;gap:6px;}

/* chart */
.chart-wrap{margin-top:28px;background:var(--white);border-radius:var(--radius-md);border:1px solid var(--line);padding:24px;}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:160px;margin-top:18px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;}
.bar{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;transition:transform .2s;}
.bar:hover{transform:scaleY(1.03);}
.bar.g{background:linear-gradient(180deg,#3CC98C,var(--ok));}
.bar.y{background:linear-gradient(180deg,#F0C25C,var(--warn));}
.bar.r{background:linear-gradient(180deg,#F08787,var(--danger));}
.bar-hour{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);}
.chart-legend{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap;}
.chart-legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);}
.legend-dot{width:9px;height:9px;border-radius:3px;}
.hours-info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;}
.hours-card{padding:16px;border-radius:12px;background:var(--white);border:1px solid var(--line);}
.hours-card h4{font-size:13.5px;margin-bottom:8px;}
.hours-card p{font-size:13px;}
.demo-note{margin-top:16px;font-size:12px;color:var(--ink-soft);font-style:italic;}

/* avisos */
.aviso-item{display:flex;gap:14px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--white);align-items:flex-start;}
.aviso-item + .aviso-item{margin-top:12px;}
.aviso-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.aviso-icon.urgente{background:rgba(214,69,69,0.12);}
.aviso-icon.atencao{background:rgba(214,154,31,0.12);}
.aviso-icon.info{background:rgba(31,163,97,0.12);}
.aviso-title{font-weight:700;font-size:14.5px;color:var(--ink);}
.aviso-msg{font-size:13.5px;margin-top:3px;}
.aviso-time{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-top:6px;}

/* diferenciais */
.diff-card{padding:26px;border-radius:var(--radius-md);background:var(--white);border:1px solid var(--line);}
.diff-num{font-family:var(--font-mono);color:var(--blue-light);font-weight:700;font-size:13px;}
.diff-card h4{font-size:16.5px;margin-top:10px;}
.diff-card p{font-size:13.5px;margin-top:8px;}

/* exam cards */
.exam-toolbar{display:flex;gap:14px;align-items:center;margin-bottom:28px;flex-wrap:wrap;}
.search-box{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:14px;padding:13px 18px;}
.search-box input{border:none;outline:none;flex:1;font-size:15px;font-family:var(--font-body);background:transparent;}
.filter-chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink-soft);}
.filter-chip.active{background:var(--blue);border-color:var(--blue);color:var(--white);}
.exam-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm);transition:box-shadow .2s, transform .2s;}
.exam-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.exam-cat{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--teal-deep);font-weight:700;}
.exam-card h4{font-size:17px;margin-top:2px;}
.exam-card p.exam-desc{font-size:13.5px;}
.exam-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
.exam-meta span{display:flex;align-items:center;gap:5px;}
.exam-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bg-soft);color:var(--blue);}
.tag.unavailable{background:rgba(214,69,69,0.12);color:var(--danger);}
.exam-card-actions{display:flex;gap:10px;margin-top:auto;padding-top:10px;}

/* Convenios */
.conv-item{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--white);}
.conv-item + .conv-item{margin-top:10px;}
.conv-name{font-weight:700;font-size:14.5px;}

/* FAQ */
.faq-item{border:1px solid var(--line);border-radius:14px;background:var(--white);overflow:hidden;}
.faq-item + .faq-item{margin-top:10px;}
.faq-q{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;font-weight:700;font-size:14.5px;}
.faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease, padding .3s ease;font-size:13.5px;padding:0 20px;color:var(--ink-soft);}
.faq-item.open .faq-a{max-height:220px;padding:0 20px 20px;}
.faq-item.open .faq-chevron{transform:rotate(180deg);}
.faq-chevron{transition:transform .25s;color:var(--teal-deep);}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(11,29,104,0.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:var(--white);border-radius:var(--radius-lg);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:30px;box-shadow:var(--shadow-lg);transform:translateY(14px);transition:transform .25s;}
.modal-overlay.show .modal-box{transform:translateY(0);}
.modal-close{position:absolute;top:18px;right:18px;width:36px;height:36px;border-radius:50%;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;font-size:16px;}
.modal-box{position:relative;}

/* Form elements */
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;font-family:var(--font-body);outline:none;transition:border-color .15s;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--teal);}
.field textarea{resize:vertical;min-height:90px;}
.field-hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

/* Steps */
.stepper{display:flex;align-items:center;gap:6px;margin-bottom:34px;flex-wrap:wrap;}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--bg-soft);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;font-family:var(--font-mono);flex-shrink:0;}
.step-dot.active{background:var(--blue);color:var(--white);}
.step-dot.done{background:var(--teal);color:var(--white);}
.step-line{flex:1;height:2px;background:var(--line);min-width:14px;}
.option-card{border:1.5px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:border-color .15s, background .15s;}
.option-card:hover{border-color:var(--blue-light);}
.option-card.selected{border-color:var(--teal);background:rgba(24,166,166,0.06);}
.option-card h4{font-size:15px;}
.option-card p{font-size:12.5px;margin-top:4px;}

/* Chatbot */
.chat-fab{position:fixed;bottom:24px;right:24px;width:58px;height:58px;border-radius:50%;background:var(--teal);color:var(--white);box-shadow:0 10px 28px rgba(24,166,166,0.4);display:flex;align-items:center;justify-content:center;font-size:24px;z-index:120;transition:transform .2s;}
.chat-fab:hover{transform:scale(1.06);}
.chat-panel{position:fixed;bottom:94px;right:24px;width:340px;max-width:90vw;height:460px;background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:121;display:none;flex-direction:column;overflow:hidden;border:1px solid var(--line);}
.chat-panel.show{display:flex;}
.chat-head{background:var(--blue);color:var(--white);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;}
.chat-head h4{color:var(--white);font-size:14.5px;}
.chat-head p{color:rgba(255,255,255,0.75);font-size:11px;margin-top:2px;}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg-soft);}
.chat-msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;}
.chat-msg.bot{background:var(--white);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-msg.user{background:var(--blue);color:var(--white);align-self:flex-end;border-bottom-right-radius:4px;}
.chat-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line);background:var(--white);}
.chat-chip{font-size:11.5px;padding:7px 11px;border-radius:999px;background:var(--bg-soft);color:var(--blue);font-weight:600;border:1px solid var(--line);}
.chat-chip:hover{background:var(--blue);color:var(--white);}

/* footer */
.site-footer{background:var(--blue-deep);color:rgba(255,255,255,0.75);padding:64px 0 28px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:40px;}
.footer-grid h4{color:var(--white);font-size:14px;margin-bottom:16px;}
.footer-grid li{margin-bottom:10px;font-size:13.5px;}
.footer-grid a:hover{color:var(--white);}
.footer-bottom{margin-top:48px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.12);display:flex;justify-content:space-between;align-items:center;font-size:12px;flex-wrap:wrap;gap:10px;}
.demo-banner{font-size:11.5px;background:rgba(255,255,255,0.08);padding:6px 12px;border-radius:999px;}

/* Dashboard */
.dash-shell{display:flex;min-height:100vh;background:var(--bg-soft);}
.dash-side{width:236px;background:var(--blue-deep);flex-shrink:0;padding:24px 16px;display:flex;flex-direction:column;}
.dash-side .logo{color:var(--white);margin-bottom:34px;padding:0 8px;}
.dash-nav a{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;color:rgba(255,255,255,0.68);font-size:14px;font-weight:600;margin-bottom:2px;}
.dash-nav a:hover{background:rgba(255,255,255,0.08);color:var(--white);}
.dash-nav a.active{background:var(--teal);color:var(--white);}
.dash-side-foot{margin-top:auto;padding:14px;border-radius:12px;background:rgba(255,255,255,0.06);font-size:12px;color:rgba(255,255,255,0.6);}
.dash-main{flex:1;padding:28px 34px;max-width:100%;overflow-x:hidden;}
.dash-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:14px;}
.dash-topbar h2{font-size:24px;}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.kpi-card{background:var(--white);border-radius:16px;padding:20px;border:1px solid var(--line);}
.kpi-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
.kpi-value{font-family:var(--font-mono);font-size:26px;font-weight:700;color:var(--blue);margin-top:8px;}
.kpi-delta{font-size:12px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--ok);}
.kpi-delta.down{color:var(--danger);}
.dash-panel{background:var(--white);border-radius:18px;border:1px solid var(--line);padding:26px;}
.dash-panel h3{font-size:16px;margin-bottom:4px;}
.dash-panel .panel-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
.status-control{display:flex;gap:10px;flex-wrap:wrap;}
.status-opt{flex:1;min-width:110px;padding:16px;border-radius:14px;border:2px solid var(--line);text-align:center;font-weight:700;font-size:13.5px;transition:all .15s;}
.status-opt.normal.active{border-color:var(--ok);background:rgba(31,163,97,0.08);color:var(--ok);}
.status-opt.moderado.active{border-color:var(--warn);background:rgba(214,154,31,0.08);color:var(--warn);}
.status-opt.alto.active{border-color:var(--danger);background:rgba(214,69,69,0.08);color:var(--danger);}
.dash-table{width:100%;border-collapse:collapse;font-size:13.5px;}
.dash-table th{text-align:left;padding:12px 14px;color:var(--ink-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--line);}
.dash-table td{padding:13px 14px;border-bottom:1px solid var(--line);}
.dash-table tr:last-child td{border-bottom:none;}
.status-chip{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.status-chip.confirmado{background:rgba(31,163,97,0.12);color:var(--ok);}
.status-chip.pendente{background:rgba(214,154,31,0.12);color:var(--warn);}
.status-chip.cancelado{background:rgba(214,69,69,0.12);color:var(--danger);}
.dash-grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;}
.rating-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rating-row .rl{width:44px;font-size:12px;color:var(--ink-soft);}
.rating-bar-bg{flex:1;height:8px;background:var(--bg-soft);border-radius:99px;overflow:hidden;}
.rating-bar-fill{height:100%;background:var(--teal);border-radius:99px;}
.comment-item{padding:14px;border-radius:12px;background:var(--bg-soft);margin-bottom:10px;}
.comment-item .cstars{color:var(--warn);font-size:12px;}
.comment-item p{font-size:13px;margin-top:6px;color:var(--ink);}
.toast{position:fixed;top:20px;right:20px;background:var(--ink);color:var(--white);padding:14px 20px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:300;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;transform:translateX(120%);transition:transform .3s ease;}
.toast.show{transform:translateX(0);}

/* misc */
.badge-float{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:110;background:var(--ink);color:var(--white);font-size:11.5px;font-family:var(--font-mono);padding:6px 14px;border-radius:999px;opacity:0.85;}
.fade-in{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.confirm-check{width:76px;height:76px;border-radius:50%;background:rgba(24,166,166,0.12);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:34px;color:var(--teal-deep);}
.summary-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .sr-label{color:var(--ink-soft);}
.summary-row .sr-value{font-weight:700;}
.protocol-box{background:var(--bg-soft);border:1.5px dashed var(--blue-light);border-radius:14px;padding:18px;text-align:center;margin:20px 0;}
.protocol-box .pb-label{font-size:11.5px;color:var(--ink-soft);font-family:var(--font-mono);text-transform:uppercase;}
.protocol-box .pb-value{font-family:var(--font-mono);font-size:22px;font-weight:700;color:var(--blue);margin-top:6px;letter-spacing:0.04em;}
.star-picker{display:flex;gap:6px;font-size:30px;color:var(--line);}
.star-picker span{cursor:pointer;transition:color .15s;}
.star-picker span.active{color:var(--warn);}

@media (max-width:980px){
  .nav-links{display:none;}
  .menu-toggle{display:flex;}
  .header-actions .btn-secondary{display:none;}
  .hero-grid{grid-template-columns:1fr;}
  .hero-quickinfo{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .status-row{grid-template-columns:1fr;}
  .footer-grid{grid-template-columns:1fr 1fr;}

  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .dash-grid-2{grid-template-columns:1fr;}
  .dash-main{padding:20px 16px;}
}
@media (max-width:600px){

}

const CHAT_QA = {
  'Como agendar?':'Você pode agendar pela seção "Agendamento" no menu, escolhendo o serviço, exame, data e horário em poucos passos.',
  'Vocês atendem convênio?':'Sim, o CDA atende diversos convênios. Consulte a disponibilidade do seu plano na página "Convênios".',
  'Qual o horário?':'Exames e agendamentos funcionam em horário comercial estendido. O Pronto Atendimento funciona 24 horas, todos os dias.',
  'Onde fica?':'O CDA fica na Av. das Diagnósticas, 500, em São Paulo/SP. Veja o mapa completo na página "Contato".',
  'Como vejo meu resultado?':'Acesse a página "Resultados de Exames" e entre no ambiente demonstrativo com CPF e senha.',
  'Preciso de jejum?':'O preparo varia por exame. Consulte a seção "Antes do seu exame" para orientações específicas.',
};
let chatOpen=false, chatHistory=[{from:'bot',text:'Olá! Sou o assistente virtual demonstrativo do CDA. Como posso ajudar?'}];
function toggleChat(){
  chatOpen=!chatOpen;
  renderChat();
}
function chatAsk(q){
  chatHistory.push({from:'user',text:q});
  const a = CHAT_QA[q] || 'Este é um assistente virtual demonstrativo e não fornece diagnóstico médico. Para essa dúvida, entre em contato com nossa central de atendimento.';
  chatHistory.push({from:'bot',text:a});
  renderChat();
}
function renderChat(){
  const panel=document.getElementById('chatPanel');
  panel.classList.toggle('show',chatOpen);
  if(!chatOpen)return;
  panel.innerHTML=`
    <div class="chat-head">
      <div><h4>Assistente CDA</h4><p>Assistente virtual demonstrativo</p></div>
      <button onclick="toggleChat()" style="color:#fff;" aria-label="Fechar chat">${ICONS.x}</button>
    </div>
    <div class="chat-body" id="chatBody">
      ${chatHistory.map(m=>`<div class="chat-msg ${m.from}">${m.text}</div>`).join('')}
    </div>
    <div class="chat-quick">
      ${Object.keys(CHAT_QA).map(q=>`<button class="chat-chip" onclick="chatAsk('${q.replace(/'/g,"\\'")}')">${q}</button>`).join('')}
    </div>`;
  const body=document.getElementById('chatBody');
  body.scrollTop=body.scrollHeight;
}

function movementChartHTML(){
  const hours=['07h','08h','09h','10h','11h','12h','13h','14h','15h','16h','17h','18h','19h'];

  const heights=[35,45,88,92,85,60,55,32,38,58,95,90,62];
  return `<div class="bar-chart">
    ${hours.map((h,i)=>`<div class="bar-col"><div class="bar ${levels[i]}" style="height:${heights[i]}%;" title="${h}"></div><div class="bar-hour">${h}</div></div>`).join('')}

  {id:'atendimento',name:'Atendimento',desc:'Consultas e avaliações'},

const HORARIOS = ['08:00','08:30','09:00','10:00','11:00','13:30','14:30','15:00','16:00','17:30'];

function resetScheduling(preExam){
  const ex = preExam? EXAMS.find(e=>e.id===preExam) : null;
  state.scheduling = {step: ex?2:1, servico: ex? (ex.catKey==='radiologia'?'radiologia':'ambulatorial') : null, exame: ex?ex.id:null, forma:null, data:null, horario:null, nome:'',cpf:'',nasc:'',telefone:'',email:''};
}

function pageAgendamento(preExam){
  if(state.scheduling.step===1 && preExam===undefined && state.scheduling.exame===null && !window.__schedInit){
    // keep as-is
  }
  const s = state.scheduling;
  return `
  <section class="section-tight" style="background:var(--bg-soft);min-height:70vh;">
    <div class="container" style="max-width:720px;">
      <div class="section-head"><div class="eyebrow">Agendamento online</div><h2 class="section-title">Agende seu exame ou atendimento</h2></div>
      ${stepperHTML(s.step)}
      <div class="dash-panel">
        ${schedulingStepContent(s)}
      </div>
    </div>
  </section>`;
}

function stepperHTML(step){
  const total=8;
  let out='<div class="stepper">';
  for(let i=1;i<=total;i++){
    out+=`<div class="step-dot ${i<step?'done':i===step?'active':''}">${i<step?'✓':i}</div>`;
    if(i<total) out+='<div class="step-line"></div>';
  }
  out+='</div>';
  return out;
}

function schedulingStepContent(s){
  if(s.step===1){
    return `
    <h3 style="font-size:17px;">Etapa 1 · Escolha o serviço</h3>
    <div class="grid-3" style="margin-top:18px;">
      ${SERVICOS.map(sv=>`<div class="option-card ${s.servico===sv.id?'selected':''}" onclick="selectServico('${sv.id}')"><h4>${sv.name}</h4><p>${sv.desc}</p></div>`).join('')}
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:26px;"><button class="btn btn-primary" ${!s.servico?'disabled':''} onclick="nextStep()">Continuar ${ICONS.arrow}</button></div>`;
  }
  if(s.step===2){
    const list = s.servico==='atendimento' ? [{id:'pa',name:'Avaliação de Pronto Atendimento',cat:'Atendimento',duration:'Variável'}] : EXAMS.filter(e=>e.catKey===s.servico);
    return `
    <h3 style="font-size:17px;">Etapa 2 · Escolha o exame</h3>
    <div class="grid-2" style="margin-top:18px;">
      ${list.map(e=>`<div class="option-card ${s.exame===e.id?'selected':''}" onclick="selectExame('${e.id}')"><h4>${e.name}</h4><p>${e.duration||''}</p></div>`).join('')}
    </div>
    ${stepNav(true, !s.exame)}`;
  }
  if(s.step===3){
    return `
    <h3 style="font-size:17px;">Etapa 3 · Forma de atendimento</h3>
    <div class="grid-2" style="margin-top:18px;">
      <div class="option-card ${s.forma==='convenio'?'selected':''}" onclick="selectForma('convenio')"><h4>Convênio</h4><p>Utilizar plano de saúde</p></div>
      <div class="option-card ${s.forma==='particular'?'selected':''}" onclick="selectForma('particular')"><h4>Particular</h4><p>Pagamento direto, sem convênio</p></div>
    </div>
    ${stepNav(true, !s.forma)}`;
  }
  if(s.step===4){
    const dates = nextDates();
    return `
    <h3 style="font-size:17px;">Etapa 4 · Escolha a data</h3>
    <div class="grid-4" style="margin-top:18px;">
      ${dates.map(d=>`<div class="option-card ${s.data===d?'selected':''}" style="text-align:center;" onclick="selectData('${d}')"><h4 style="font-size:14px;">${d}</h4></div>`).join('')}
    </div>
    ${stepNav(true, !s.data)}`;
  }
  if(s.step===5){
    return `

/* ============ ROUTER ============ */
function parseHash(){
  let hash = location.hash.replace('#','') || 'home';
  let [route, qs] = hash.split('?');
  const params = {};
  if(qs){ qs.split('&').forEach(p=>{const [k,v]=p.split('='); params[k]=decodeURIComponent(v||'');}); }
  return {route, params};
}

function render(skipScroll){
  const {route, params} = parseHash();

  if(route.startsWith('dash-')){
    state.dashboardMode = true;
    state.dashRoute = route.replace('dash-','');
    renderDashboard();
    return;
  }
  state.dashboardMode = false;
  state.route = route;

  let content='';
  if(route==='home') content = pageHome();
  else if(route==='exames') content = pageExames(params.cat);
  else if(route==='pronto-atendimento') content = pageProntoAtendimento();
  else if(route==='agendamento'){
    if(params.exame && state.scheduling.exame!==params.exame && state.scheduling.step===1 && !window.__lastPreExam){
      window.__lastPreExam = params.exame;
      resetScheduling(params.exame);
    }
    content = pageAgendamento(params.exame);
  }
  else if(route==='resultados') content = pageResultados();
  else if(route==='convenios') content = pageConvenios();
  else if(route==='area-paciente') content = pageAreaPaciente();
  else if(route==='sobre') content = pageSobre();
  else if(route==='contato') content = pageContato();
  else if(route==='faq') content = pageFaq();
  else if(route==='privacidade') content = pageLegal('privacidade');
  else if(route==='termos') content = pageLegal('termos');
  else if(route==='acessibilidade') content = pageLegal('acessibilidade');
  else content = pageHome();

  document.getElementById('app').innerHTML = headerHTML() + `<main>${content}</main>` + footerHTML();
  if(!skipScroll) window.scrollTo({top:0,behavior:'instant' in window ? 'instant':'auto'});
  const mn=document.getElementById('mobileNav'); if(mn) mn.style.display='none';
}

window.addEventListener('hashchange', ()=>render());
window.addEventListener('DOMContentLoaded', ()=>{
  if(!location.hash) location.hash = '#home';
  render();
});

</script>
</body>
</html>
